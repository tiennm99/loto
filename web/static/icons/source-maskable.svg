<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Maskable variant of source.svg: the launcher's mask supplies the shape,
    so the gradient bleeds to every edge (no rounded tile, no dark border)
    and the wordmark shrinks to 160 so it stays inside the central 80%
    safe-zone circle. Same composition as the Android adaptive icon.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8e7"/>
      <stop offset="100%" stop-color="#ffe9b8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <text
    x="256" y="316"
    text-anchor="middle"
    font-family="Roboto Condensed, Arial Narrow, system-ui, sans-serif"
    font-weight="900"
    font-size="160"
    font-style="italic"
    letter-spacing="-6"
    fill="url(#text)"
    style="paint-order:stroke;stroke:#0a0f1f;stroke-width:6;stroke-opacity:0.18"
  >Lô tô</text>
</svg>
