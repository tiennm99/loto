<!doctype html>
<html lang="vi" class="h-full antialiased">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to report
         real values under Android's forced edge-to-edge and on notched iOS. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="format-detection" content="telephone=no" />
    <!-- Blocking pre-paint theme script. `loadSettings()` in +layout.svelte
         (client-only, runs in onMount) is the authoritative pass and keeps
         its own validation; this duplicate, defensively-guarded read only
         has to get the FIRST paint right so dark-mode users don't see a
         full-page light flash before hydration. Runs before app.css's
         <link> (injected by %sveltekit.head% further down) so `.dark`/the
         custom property are already set by the time styles apply. -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("loto_settings");
          var parsed = raw ? JSON.parse(raw) : null;
          var theme =
            parsed && typeof parsed.theme === "string" ? parsed.theme : "auto";
          var dark =
            theme === "dark" ||
            (theme !== "light" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          var color =
            parsed &&
            typeof parsed.emptyCellColor === "string" &&
            /^#[0-9a-fA-F]{6}$/.test(parsed.emptyCellColor)
              ? parsed.emptyCellColor
              : null;
          if (color) {
            document.documentElement.style.setProperty(
              "--empty-cell-bg",
              color,
            );
          }
        } catch (e) {
          /* private mode / corrupt JSON — fall back to light + default
             color, same as loadSettings()'s own catch. */
        }
      })();
    </script>
    <title>Lô tô — Hội chợ TN1</title>
    <meta
      name="description"
      content="Ứng dụng Lô tô (Bingo 90) cho hội chợ TN1 — bàn số người chơi, bộ quay người dẫn, gọi số bằng giọng nói tiếng Việt, chơi offline."
    />
    <meta name="application-name" content="Lô tô — Hội chợ TN1" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="%sveltekit.assets%/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icons/icon-192.png" />
    <meta name="theme-color" content="#1565c0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0f1f" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lô tô" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:site_name" content="Lô tô — Hội chợ TN1" />
    <meta property="og:title" content="Lô tô — Hội chợ TN1" />
    <meta
      property="og:description"
      content="Ứng dụng Lô tô (Bingo 90) cho hội chợ TN1 — gọi số tiếng Việt, chơi offline, cài đặt như app điện thoại."
    />
    <meta property="og:url" content="https://tiennm99.github.io/loto/" />
    <meta property="og:image" content="https://tiennm99.github.io/loto/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Lô tô — Hội chợ TN1" />
    <meta
      name="twitter:description"
      content="Ứng dụng Lô tô (Bingo 90) cho hội chợ TN1 — gọi số tiếng Việt, chơi offline."
    />
    <meta name="twitter:image" content="https://tiennm99.github.io/loto/icons/icon-512.png" />
    %sveltekit.head%
  </head>
  <body class="min-h-full flex flex-col">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
