# Originally generated by the Firebase CLI
# https://github.com/firebase/firebase-tools
# entryPoint points the action at web/, where firebase.json and .firebaserc live.

name: web / deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/web-firebase-hosting-merge.yml'
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npm ci && npm run build
        working-directory: web
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LOOTOO }}
          channelId: live
          projectId: lootoo
          entryPoint: web
