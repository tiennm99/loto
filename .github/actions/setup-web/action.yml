name: Set up web toolchain
description: >
  Installs Node, then restores web/ dependencies from the lockfile.
  Node stays in lockstep with .github/actions/setup-android so the SvelteKit
  app is tested and bundled into the APK on the same runtime.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: web/package-lock.json

    - run: npm ci
      shell: bash
      working-directory: web
