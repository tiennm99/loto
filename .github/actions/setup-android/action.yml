name: Set up Android toolchain
description: >
  Installs the JDK and configures Gradle caching for the native Android
  project in android/. The app is pure Kotlin/Compose — no Node, no web
  build artifact.

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'

    - uses: gradle/actions/setup-gradle@v6
      with:
        cache-provider: basic
